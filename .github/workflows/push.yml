name: Push

on:
  push:
    branches: [main]

concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  test:
    name: Build and Test
    uses: ./.github/workflows/build.yml

  publish:
    needs: [test]
    permissions:
      contents: read
      packages: write
    name: Publish latest tag
    uses: ./.github/workflows/publish-latest.yml

  redeploy:
    needs: [publish]
    name: Redeploy on prd
    runs-on: ubuntu-latest
    steps:
      - name: Trigger downstream GitLab pipeline
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
        run: |
          curl --fail -sS -X POST \
            -F token="$GITLAB_TRIGGER_TOKEN" \
            -F ref=prd \
            -F "variables[TRIGGER_RELEASE]=twake-blog" \
            "https://ci.linagora.com/api/v4/projects/3980/trigger/pipeline"
