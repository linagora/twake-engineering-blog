server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS is terminated by an upstream proxy; this server only sees plain HTTP on
    # 8080. Keep redirects relative so the browser resolves them against the
    # original request origin (https://host) instead of nginx emitting an
    # absolute Location with the internal scheme and port (http://host:8080).
    absolute_redirect off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Security headers — these MUST be repeated in every `location` block that
    # defines its own `add_header`, because nginx's add_header inheritance
    # rule is "any add_header in a child block overrides the parent's set".
    # We use a small `set` indirection so the list lives in one place.
    set $sec_csp "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'";

    # Astro emits hashed assets under /_astro: cache aggressively
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Pagefind index: short cache, refresh between deploys
    location /pagefind/ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Static assets (fonts, images): medium cache
    location ~* \.(woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # RSS feeds: short cache
    location ~ ^/rss-(fr|en)\.xml$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        types { } default_type "application/rss+xml; charset=utf-8";
        try_files $uri =404;
    }

    # Apex: redirect to the default locale with a real HTTP 30x. Crawlers and link
    # unfurlers follow it but ignore the meta-refresh stub Astro builds at /index.html
    # for the same `/` -> `/en` redirect (that stub is kept only for `astro dev`).
    location = / {
        return 302 /en;
    }

    # HTML pages: no aggressive caching, must revalidate
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
